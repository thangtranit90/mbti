name = "mbti-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "mbti"
# Cloudflare account 1d2219b9236cf74b59467af456e0fbab; provisioned 2026-04-30 (Story 1.6 unblock pass).
database_id = "ea15a996-8fd9-4ef9-8e6b-3ea13eb6c581"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "KV"
# Cloudflare account 1d2219b9236cf74b59467af456e0fbab; provisioned 2026-04-30 (Story 1.6 unblock pass).
id = "d9b775c3668e4e39ae708fb0ee2ae53a"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "mbti-assets"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
