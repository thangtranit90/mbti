name = "mbti-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "mbti"
# TODO Story 1.5 / Task 1.1: run `wrangler d1 create mbti` and replace this UUID
# with the printed database_id. Required for `wrangler d1 ... --remote` operations
# (AC-4, AC-5). The placeholder below is sufficient for `--local` SQLite work.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "KV"
# TODO Story 1.6: replace with real id from `wrangler kv namespace create KV`.
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
# TODO Story 1.6: create via `wrangler r2 bucket create mbti-assets`.
bucket_name = "mbti-assets"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
